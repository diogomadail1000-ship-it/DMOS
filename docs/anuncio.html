<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">

<title>Publicidade</title>
<style>html, body { margin: 0; overflow: hidden; background: transparent; }</style>

<body>
<!-- Moldura de um anúncio: ?w=LARGURA&h=ALTURA&k=CHAVE. É carregada pelo site dentro de um iframe. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var w = parseInt(q.get("w"), 10), h = parseInt(q.get("h"), 10), k = q.get("k") || "";
    if (!w || !h || !/^[0-9a-f]{32}$/.test(k)) return;
    window.atOptions = { key: k, format: "iframe", height: h, width: w, params: {} };
    document.write('<script src="https://bauval.org/22/' + k + '"><\/script>');
    setTimeout(function () {
      parent.postMessage({ dmosAd: document.querySelectorAll("iframe,img,a,ins").length }, "*");
    }, 4000);
  })();
</script>
</body>
</html>
