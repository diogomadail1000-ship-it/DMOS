source /boot/grub/config.cfg

set timeout=8

menuentry "Experimentar o DMOS" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Try DMOS (English)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us timezone=UTC
	initrd	@INITRD_LIVE@
}

menuentry "Modo de compatibilidade gráfica" --hotkey=c {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "Definições do firmware UEFI" --hotkey=f {
		fwsetup
	}
fi
