set default=0

# The theme fonts go first: gfxterm's default font is the last one loaded, and it
# should be Unifont, not a 40-point display face.
source /boot/grub/theme.cfg

# Signed UEFI GRUB carries Unifont in its memdisk (and refuses fonts from disk under
# Secure Boot); BIOS GRUB only finds it next to grub.cfg. Without it, BIOS gets a text menu.
if loadfont unicode ; then
    set gfxmode=1920x1080x32,1280x720x32,auto
elif loadfont $prefix/unicode.pf2 ; then
    set gfxmode=1920x1080x32,1280x720x32,auto
else
    set gfxmode=auto
fi
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
insmod jpeg

terminal_output gfxterm
