# Debian's list also names live-task-* packages. They are not part of DMOS, and with
# no package index on the target apt rejects unknown names, which aborts the install.
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-boot-initramfs-tools'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares-settings-debian'
      - 'calamares'
