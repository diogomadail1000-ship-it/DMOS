<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>DMOS: short da aplicação para Android</title>
<!--
  YouTube Short vertical (1080x1920, ~22 s): a aplicação DMOS para Android. Usa as capturas reais de
  docs/app/capturas. Gerar: node video/render.js video/out short-app.html dmos-short-app
  O texto fica entre y=230 e y=1500 e longe da margem direita, fora das zonas que o YouTube tapa.
-->
<style>
  :root { --text: #E8ECF5; --muted: #B4BCD2; --accent: #2DD4BF; --tide: linear-gradient(120deg, #5EEAD4 0%, #46B6E0 45%, #FF8A70 80%, #FFC38A 100%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0C1122; color: var(--text); font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; overflow: hidden; display: none; }
  .tide-text { background: var(--tide); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .backdrop { position: absolute; inset: -100px; background: url(../docs/screenshots/4-ambiente-escuro.jpg) 62% 70% / auto 120%; filter: blur(30px) saturate(1.3); }
  .dim { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(12,17,34,0.35), rgba(12,17,34,0.9)); }
  .hook { position: absolute; left: 70px; right: 140px; font-weight: 900; letter-spacing: -0.045em; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.45); }
  .cap { position: absolute; left: 70px; right: 150px; top: 245px; }
  .kicker { font-size: 34px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .title { font-size: 84px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,0.45); }
  .sub { font-size: 40px; font-weight: 600; color: var(--muted); margin-top: 16px; line-height: 1.2; }
  /* Telemóvel com a captura da aplicação (618x1320). */
  .phone { position: absolute; left: 50%; top: 600px; width: 440px; height: 940px; margin-left: -260px; border-radius: 54px; background: #05070F; padding: 14px; box-shadow: 0 50px 120px rgba(0,0,0,0.7), 0 0 0 3px rgba(255,255,255,0.12); transform-origin: 50% 60%; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 42px; display: block; }
  .center { position: absolute; left: 70px; right: 140px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { width: 150px; height: 150px; margin-bottom: 40px; }
  .big { font-size: 124px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95; }
  .facts { display: grid; gap: 22px; margin-top: 56px; width: 100%; }
  .fact { font-size: 50px; font-weight: 800; padding: 24px 30px; border-radius: 34px; background: rgba(17,23,43,0.92); border: 3px solid rgba(255,255,255,0.14); }
  .pill { margin-top: 44px; font-size: 56px; font-weight: 900; padding: 24px 50px; border-radius: 999px; background: var(--tide); color: #0C1122; }
</style>
</head>
<body>
  <div id="stage"></div>
<script>
window.SIZE = [1080, 1920];
window.MUSIC_BAR = 2.4;
var CUT = 0.3;
var SHOT = "../docs/app/capturas/";
var SCENES = [
  { type: "hook", dur: 3.2 },
  { type: "phone", dur: 4.2, img: "1-inicio", kicker: "Novo", title: "O DMOS no telemóvel", sub: "As novidades de cada versão, logo ao abrir" },
  { type: "phone", dur: 4.4, img: "2-noticias", kicker: "Notícias", title: "Só as fontes que escolher", sub: "As do DMOS Hub, e as suas" },
  { type: "phone", dur: 4.0, img: "3-ajuda", kicker: "Ajuda", title: "Um assistente à mão", sub: "Responde mesmo sem rede" },
  { type: "phone", dur: 3.6, img: "4-guias", kicker: "Guias", title: "Vídeos e atalhos", sub: "Para ter ao lado do computador" },
  { type: "cta", dur: 5.2 }
];
var stage = document.getElementById("stage");
var start = 0;
SCENES.forEach(function (s) {
  s.start = start; start += s.dur - CUT;
  var el = document.createElement("div"); el.className = "scene";
  var bg = '<div class="backdrop"></div><div class="dim"></div>';
  if (s.type === "hook") {
    el.innerHTML = bg + '<div class="hook h1" style="top:560px;font-size:150px">O DMOS</div>' +
      '<div class="hook h2" style="top:740px;font-size:150px">agora cabe</div>' +
      '<div class="hook h3" style="top:920px;font-size:170px"><span class="tide-text">no bolso</span></div>' +
      '<div class="hook h4" style="top:1180px;font-size:56px;color:var(--muted);font-weight:700;letter-spacing:-0.01em">Nova aplicação para Android</div>';
  } else if (s.type === "phone") {
    el.innerHTML = bg + '<div class="cap"><div class="kicker">' + s.kicker + '</div><div class="title">' + s.title + '</div><div class="sub">' + s.sub + '</div></div>' +
      '<div class="phone"><img src="' + SHOT + s.img + '.jpg" alt=""></div>';
  } else {
    el.innerHTML = bg + '<div class="center"><img class="logo" src="../art/logo.svg" alt="">' +
      '<div class="big">DMOS para <span class="tide-text">Android</span></div>' +
      '<div class="facts"><div class="fact">Grátis · 92 KB</div><div class="fact">Sem publicidade nem contas</div></div>' +
      '<div class="pill">dmos.cc/app</div></div>';
  }
  stage.appendChild(el); s.el = el;
});
window.TOTAL = start + CUT;

function clamp(x) { return Math.max(0, Math.min(1, x)); }
function ease(x) { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function out(x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); }
function back(x) { x = clamp(x); var c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lerp(a, b, k) { return a + (b - a) * k; }
function pop(el, local, t0, from) {
  if (!el) return; var k = clamp((local - t0) / 0.45);
  el.style.opacity = out(k); el.style.transform = "translateY(" + (1 - out(k)) * 40 + "px) scale(" + lerp(from || 0.85, 1, back(k)) + ")";
}

window.seek = function (t) {
  SCENES.forEach(function (s, i) {
    var local = t - s.start, el = s.el;
    if (local < 0 || local > s.dur) { el.style.display = "none"; return; }
    el.style.display = "block"; el.style.zIndex = i;
    var fin = i === 0 ? 1 : clamp(local / CUT), fout = i === SCENES.length - 1 ? clamp((s.dur - local) / 0.8) : 1;
    el.style.opacity = Math.min(ease(fin), ease(fout));
    var p = local / s.dur;
    if (s.type === "hook") {
      pop(el.querySelector(".h1"), local, 0.05, 0.6); pop(el.querySelector(".h2"), local, 0.4, 0.6);
      pop(el.querySelector(".h3"), local, 0.8, 0.6); pop(el.querySelector(".h4"), local, 1.4);
    } else if (s.type === "phone") {
      pop(el.querySelector(".kicker"), local, 0.1); pop(el.querySelector(".title"), local, 0.22); pop(el.querySelector(".sub"), local, 0.5);
      // O telemóvel sobe e aproxima-se devagar.
      var k = out(clamp(local / 0.7)), ph = el.querySelector(".phone");
      ph.style.opacity = k;
      ph.style.transform = "translateY(" + ((1 - k) * 140) + "px) scale(" + lerp(1, 1.05, p) + ")";
    } else {
      var logo = el.querySelector(".logo"), lk = clamp(local / 0.6);
      logo.style.opacity = out(lk); logo.style.transform = "scale(" + lerp(0.5, 1, back(lk)) + ")";
      pop(el.querySelector(".big"), local, 0.2, 0.7);
      el.querySelectorAll(".fact").forEach(function (f, j) { pop(f, local, 0.8 + j * 0.35); });
      var pill = el.querySelector(".pill"); pop(pill, local, 1.6);
      if (local > 2.2) pill.style.transform += " scale(" + (1 + 0.03 * Math.sin((local - 2.2) * 5)) + ")";
    }
  });
};
window.thumbnail = function () { window.seek(5.5); };
window.seek(location.hash ? parseFloat(location.hash.slice(1)) || 0 : 0);
</script>
</body>
</html>
