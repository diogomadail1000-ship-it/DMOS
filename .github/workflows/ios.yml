name: Aplicação iOS

# Compila a aplicação para iPhone e iPad num Mac do GitHub, experimenta-a no simulador e guarda o
# resultado como artefacto: o .ipa (sem assinatura), uma captura de ecrã e o relatório do teste.
on:
  workflow_dispatch:
  push:
    paths:
      - "app-ios/**"
      - "app-android/www/**"
      - "app-android/gerar-dados.js"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compilar para iPhone e iPad
        run: app-ios/build.sh

      - name: Compilar para o simulador
        run: app-ios/build.sh simulador

      - name: Experimentar no simulador
        run: |
          set -euo pipefail
          mkdir -p teste
          ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          grupos = json.load(sys.stdin)["devices"]
          iphones = [(nome, d) for nome, lista in grupos.items() if "iOS" in nome for d in lista if d["name"].startswith("iPhone")]
          iphones.sort(key=lambda p: [int(n) for n in p[0].split("iOS-")[-1].split("-")])
          print(iphones[-1][1]["udid"])')"
          xcrun simctl boot "$ID"
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl install "$ID" app-ios/build/simulador/DMOS.app
          SIMCTL_CHILD_DMOS_TESTE=1 xcrun simctl launch "$ID" cc.dmos.app
          sleep 20
          xcrun simctl io "$ID" screenshot teste/noticias.png
          DADOS="$(xcrun simctl get_app_container "$ID" cc.dmos.app data)"
          for i in $(seq 1 30); do [ -f "$DADOS/Documents/teste.json" ] && break; sleep 2; done
          xcrun simctl io "$ID" screenshot teste/noticias-fim.png
          cp "$DADOS/Documents/teste.json" teste/
          cat teste/teste.json; echo
          python3 - <<'PY'
          import json
          r = json.load(open("teste/teste.json"))
          falhas = [n for n, ok in {
              "ponte": r.get("ponte"), "versão do DMOS": r.get("versaoDmos", "").startswith("DMOS"),
              "novidades": r.get("novidades", 0) > 0, "fontes": r.get("fontes", 0) >= 10,
              "notícias": r.get("noticias", 0) > 0, "vídeos": r.get("videos", 0) > 0,
              "memória": r.get("memoria"), "estilo": r.get("estilo") == "fixed",
          }.items() if not ok]
          if falhas: raise SystemExit("Falhou: " + ", ".join(falhas))
          print("Teste no simulador: passou.")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmos-ios
          path: |
            app-ios/build/*.ipa
            teste/
          if-no-files-found: warn
